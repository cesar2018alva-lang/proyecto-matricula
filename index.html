<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Matrícula</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Sistema de Matrícula</h1>
      <p>Registro básico de estudiantes</p>
    </header>

    <section class="panel">
      <h2>Registrar estudiante</h2>
      <form id="studentForm">
        <label for="names">Nombres</label>
        <input id="names" name="names" type="text" placeholder="Ej. Ana María" required>

        <label for="surnames">Apellidos</label>
        <input id="surnames" name="surnames" type="text" placeholder="Ej. Torres Pérez" required>

        <label for="dni">DNI (8 dígitos)</label>
        <input id="dni" name="dni" type="text" inputmode="numeric" maxlength="8"
               placeholder="Ej. 12345678" required>
        <small id="dniHelp">El DNI es obligatorio y debe tener 8 números.</small>

        <button type="submit">Registrar estudiante</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Estudiantes registrados</h2>
      <p id="emptyMessage">Todavía no hay estudiantes registrados.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>N.º</th><th>Nombres</th><th>Apellidos</th><th>DNI</th></tr>
          </thead>
          <tbody id="studentList"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
